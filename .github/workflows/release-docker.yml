name: Release Docker Image

on:
  schedule:
    # 每周二和周五的12点（UTC时间）
    - cron: "0 12 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: siyuan-note/siyuan
  UPSTREAM_IMAGE: b3log/siyuan
  docker_hub_repo: siyuan

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout patches repo
        uses: actions/checkout@v5
        with:
          path: patches-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest upstream release
        id: upstream
        run: |
          RESPONSE=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest)
          LATEST=$(echo "$RESPONSE" | jq -r .tag_name)

          if [ "$LATEST" = "null" ] || [ -z "$LATEST" ]; then
            echo "Error: Failed to get latest release version"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream version: $LATEST"

      - name: Check if version already built
        id: check
        run: |
          VERSION=${{ steps.upstream.outputs.version }}

          # Check if this version tag already exists in Docker Hub
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:pull" | jq -r .token)

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry-1.docker.io/v2/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}/manifests/$VERSION")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists in Docker Hub, skipping build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Will build version $VERSION"
          fi

      - name: Clone upstream and apply patches
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION=${{ steps.upstream.outputs.version }}
          git clone --branch $VERSION --depth=1 https://github.com/${{ env.UPSTREAM_REPO }}.git siyuan
          cd siyuan

          echo "Applying patches..."
          for patch in ${{ github.workspace }}/patches-repo/patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying: $(basename $patch)"
              git apply "$patch"
            fi
          done

      - name: Free Disk Space (Ubuntu)
        if: steps.check.outputs.skip != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Pin upstream Docker image for ONNX Runtime
        if: steps.check.outputs.skip != 'true'
        id: onnx
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          IMAGE="$UPSTREAM_IMAGE:$VERSION"
          MANIFEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}')
          DIGEST=$(jq -er '
            select(any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64")) |
            select(any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")) |
            .digest | select(test("^sha256:[0-9a-f]{64}$"))
          ' <<< "$MANIFEST") || {
            echo "Invalid or incomplete multi-arch manifest for $IMAGE" >&2
            exit 1
          }
          echo "image=$UPSTREAM_IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Using ONNX Runtime from $IMAGE ($DIGEST)"

      - name: Log in to Docker Hub
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./siyuan
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: ONNX_IMAGE=${{ steps.onnx.outputs.image }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:${{ steps.upstream.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.docker_hub_repo }}:${{ steps.upstream.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.docker_hub_repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch build
        if: steps.check.outputs.skip != 'true'
        run: |
          IMAGE_TAG="${{ steps.upstream.outputs.version }}"
          echo "Verifying multi-arch manifest for ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:${IMAGE_TAG}"
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:${IMAGE_TAG}

      - name: Record published release
        if: steps.check.outputs.skip == 'false' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        working-directory: patches-repo
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          git fetch --no-tags origin "$GITHUB_REF"
          git switch --detach FETCH_HEAD

          RECORD=.workflows/last-release.json
          if [ -f "$RECORD" ] && jq -e --arg version "$VERSION" '.version == $version' "$RECORD" > /dev/null; then
            echo "Release $VERSION is already recorded"
            exit 0
          fi

          mkdir -p .workflows
          jq -n --arg version "$VERSION" \
            --arg published_at "$(date -u +%FT%TZ)" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{version: $version, published_at: $published_at, run_url: $run_url}' > "$RECORD"
          git add -- "$RECORD"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "ci: record Docker release $VERSION"
          git push origin "HEAD:$GITHUB_REF"

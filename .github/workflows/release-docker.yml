name: Release Docker Image

on:
  schedule:
    # 每周二和周五的12点（UTC时间）
    - cron: "0 12 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  UPSTREAM_REPO: siyuan-note/siyuan
  docker_hub_repo: siyuan

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout patches repo
        uses: actions/checkout@v5
        with:
          path: patches-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record workflow execution start
        run: |
          mkdir -p .workflows
          echo "Workflow execution started" >> .workflows/execution.log
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> .workflows/execution.log
          echo "Trigger: ${{ github.event_name }}" >> .workflows/execution.log
          echo "Run ID: ${{ github.run_id }}" >> .workflows/execution.log
          echo "Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> .workflows/execution.log
          echo "Actor: ${{ github.actor }}" >> .workflows/execution.log
          echo "---" >> .workflows/execution.log
          cat .workflows/execution.log

      - name: Get latest upstream release
        id: upstream
        run: |
          RESPONSE=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest)
          LATEST=$(echo "$RESPONSE" | jq -r .tag_name)

          if [ "$LATEST" = "null" ] || [ -z "$LATEST" ]; then
            echo "Error: Failed to get latest release version"
            echo "Response: $RESPONSE"
            exit 1
          fi

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest upstream version: $LATEST"

      - name: Check if version already built
        id: check
        run: |
          VERSION=${{ steps.upstream.outputs.version }}

          # Check if this version tag already exists in Docker Hub
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:pull" | jq -r .token)

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry-1.docker.io/v2/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}/manifests/$VERSION")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists in Docker Hub, skipping build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Will build version $VERSION"
          fi

          # Record version check result
          echo "" >> .workflows/execution.log
          echo "Version check completed" >> .workflows/execution.log
          echo "Latest upstream version: $VERSION" >> .workflows/execution.log
          echo "Build needed: $([ "$HTTP_CODE" != "200" ] && echo 'yes' || echo 'no')" >> .workflows/execution.log
          echo "---" >> .workflows/execution.log

      - name: Clone upstream and apply patches
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION=${{ steps.upstream.outputs.version }}
          git clone --branch $VERSION --depth=1 https://github.com/${{ env.UPSTREAM_REPO }}.git siyuan
          cd siyuan

          echo "Applying patches..."
          for patch in ${{ github.workspace }}/patches-repo/patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying: $(basename $patch)"
              git apply "$patch" || echo "Warning: Failed to apply $patch"
            fi
          done

          git status

      - name: Free Disk Space (Ubuntu)
        if: steps.check.outputs.skip != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
          buildkitd-flags: |
            --allow-insecure-entitlement security.insecure
            --allow-insecure-entitlement network.host

      - name: Log in to Docker Hub
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: steps.check.outputs.skip != 'true'
        working-directory: siyuan
        run: |
          IMAGE_TAG="${{ steps.upstream.outputs.version }}"

          echo "Building multi-arch image with tag: $IMAGE_TAG"
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:${IMAGE_TAG} \
            --tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:latest \
            --tag ghcr.io/${{ github.repository_owner }}/${{ env.docker_hub_repo }}:${IMAGE_TAG} \
            --tag ghcr.io/${{ github.repository_owner }}/${{ env.docker_hub_repo }}:latest \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            .

      - name: Verify multi-arch build
        if: steps.check.outputs.skip != 'true'
        run: |
          IMAGE_TAG="${{ steps.upstream.outputs.version }}"
          echo "Verifying multi-arch manifest for ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:${IMAGE_TAG}"
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.docker_hub_repo }}:${IMAGE_TAG}

      - name: Record build skipped
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "" >> .workflows/execution.log
          echo "Build skipped (version already exists)" >> .workflows/execution.log
          echo "Skipped version: ${{ steps.upstream.outputs.version }}" >> .workflows/execution.log
          echo "End time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> .workflows/execution.log
          echo "=== END ===" >> .workflows/execution.log

      - name: Record workflow completion
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "" >> .workflows/execution.log
          echo "Build completed successfully" >> .workflows/execution.log
          echo "End time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> .workflows/execution.log
          echo "Built version: ${{ steps.upstream.outputs.version }}" >> .workflows/execution.log
          echo "=== END ===" >> .workflows/execution.log

      - name: Commit workflow execution log
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .workflows/execution.log
          git diff --cached --stat
          git commit -m "ci: record workflow execution - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
        continue-on-error: true

      - name: Push execution log
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
        continue-on-error: true

      - name: Record workflow failure
        if: failure()
        run: |
          echo "" >> .workflows/execution.log
          echo "!!! BUILD FAILED !!!" >> .workflows/execution.log
          echo "Failed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> .workflows/execution.log
          echo "Version: ${{ steps.upstream.outputs.version }}" >> .workflows/execution.log
          echo "Error: Check workflow logs for details" >> .workflows/execution.log
          echo "=== END ===" >> .workflows/execution.log
        continue-on-error: true
